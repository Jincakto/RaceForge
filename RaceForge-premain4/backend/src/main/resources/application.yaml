spring:
  config:
    import: optional:file:./backend/.env[.properties],optional:file:./.env[.properties]
  application:
    name: backend
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=RaceForge;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:12345}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        default_schema: dbo
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0

springdoc:
  override-with-generic-response: false
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    operations-sorter: alpha
    tags-sorter: alpha

raceforge:
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET:change-this-dev-secret-to-at-least-32-bytes-long}
    issuer: ${JWT_ISSUER:raceforge}
    audience: ${JWT_AUDIENCE:raceforge-api}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
  refresh-token:
    days: ${REFRESH_TOKEN_DAYS:7}
    cookie-name: ${REFRESH_TOKEN_COOKIE:raceforge_refresh}
    secure-cookie: ${REFRESH_TOKEN_SECURE:false}
    same-site: ${REFRESH_TOKEN_SAME_SITE:Lax}
  otp:
    secret: ${OTP_HMAC_SECRET:change-this-otp-hmac-secret-to-at-least-32-bytes}
    minutes: ${OTP_MINUTES:5}
    resend-seconds: ${OTP_RESEND_SECONDS:60}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
  password-reset:
    minutes: ${PASSWORD_RESET_MINUTES:15}
    frontend-url: ${FRONTEND_URL:http://localhost:5173/reset-password}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    password-setup-minutes: ${GOOGLE_PASSWORD_SETUP_MINUTES:15}
  mail:
    from: ${MAIL_FROM:no-reply@raceforge.local}
